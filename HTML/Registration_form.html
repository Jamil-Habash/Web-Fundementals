<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <h1>Registration Form</h1>
        <form action="submit_form.php" method="post">
            <label for="first_name">First Name: *</label>
            <input type="text" id="first_name" name="first_name" required><br><br>

            <label for="last_name">Last Name: *</label>
            <input type="text" id="last_name" name="last_name" required><br><br>

            <label for="email">Email Address: *</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password: *</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="confirm_password">Confirm Password: *</label>
            <input type="password" id="confirm_password" name="confirm_password" required><br><br>
            
            <label for="bday">Birthday: *</label>
            <input type="date" id="bday" name="bday" required><br><br>
            <label for="gender">Gender: *</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label><br><br>

            <label for="description">A Short Description about myself:</label><br>
            <textarea id="description" name="description" rows="4" cols="50"></textarea><br><br>
            <label for="language">Favorite Language:</label>
            <select id="language" name="language">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
                <option value="c++">C++</option>
            </select><br><br>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">Yes, I would like to receive email updates</label><br><br>
            
            <input type="submit" value="Create Account">
            <label> * Indicates a required field</label>
        </form>
    </body>
</html>
