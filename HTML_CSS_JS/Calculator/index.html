<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Calculator</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
        <div id="calculator">
            <div id="display">0</div>
            <div class="row">
                <button class="btn" data-value="7" onclick="press(7)">7</button>
                <button class="btn" data-value="8" onclick="press(8)">8</button>
                <button class="btn" data-value="9" onclick="press(9)">9</button>
                <button class="btn_operator" data-value="/" onclick="press('/')">/</button>
            </div>
            <div class="row">
                <button class="btn" data-value="4" onclick="press(4)">4</button>
                <button class="btn" data-value="5" onclick="press(5)">5</button>
                <button class="btn" data-value="6" onclick="press(6)">6</button>
                <button class="btn_operator" data-value="*" onclick="press('*')">*</button>
            </div>
            <div class="row">
                <button class="btn" data-value="1" onclick="press(1)">1</button>
                <button class="btn" data-value="2" onclick="press(2)">2</button>
                <button class="btn" data-value="3" onclick="press(3)">3</button>
                <button class="btn_operator" data-value="-" onclick="press('-')">-</button>
            </div>
            <div class="row">
                <button class="btn" data-value="C" onclick="clr()">C</button>
                <button class="btn" data-value="0" onclick="press(0)">0</button>
                <button class="btn" data-value="." onclick="press('.')">.</button>
                <button class="btn_operator" data-value="+" onclick="press('+')">+</button>
            </div>
            <div class="row">
                <button class="btn_equal" data-value="=" onclick="calculate()">=</button>
            </div>
        </div>
         <script src="script.js"></script>
        </body>
</html>
